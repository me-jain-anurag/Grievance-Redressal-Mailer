services:
  - type: web
    name: grievance-redressal-mailer
    env: node
    plan: free
    buildCommand: |
      cd client && npm ci && VITE_API_BASE_URL=/api npm run build
      cd ../server && npm ci && npm rebuild sqlite3 --build-from-source || true
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PORTAL_KEY
        generateValue: true